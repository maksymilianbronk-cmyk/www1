<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drzewo rodziny — Herbarz Polski</title>
<meta name="description" content="Edytowalne drzewo genealogiczne rodziny z herbami — widok drzewa i listy, zapis w przeglądarce.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 34"><path d="M15 1 28 6v10c0 8-5.5 13.5-13 17C7.5 29.5 2 24 2 16V6z" fill="%231a1a23" stroke="%23d4af37" stroke-width="1.6"/><path d="M15 6.5 17.2 12h5.6l-4.5 3.6 1.7 5.7-5-3.4-5 3.4 1.7-5.7L7.2 12h5.6z" fill="%23d4af37"/></svg>'>
<meta name="theme-color" content="#0f0f13">
<style>
  :root{
    --bg:#0f0f13; --bg2:#16161d; --card:#1a1a23; --line:#2a2a36; --line2:#4a4130;
    --txt:#e8e8f0; --muted:#9a9aad; --accent:#6c63ff;
    --gold:#d4af37; --gold2:#f0d67c; --roz:#c96f8d; --blekit:#5b8dd6;
    --serif:"Cormorant Garamond","Times New Roman",serif;
    --sans:"Segoe UI",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.5;
    min-height:100vh;display:flex;flex-direction:column}
  h1,h2,h3{font-family:var(--serif)}
  a{color:var(--gold);text-decoration:none}
  button{font-family:inherit}

  /* ── pasek górny ── */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
    padding:12px 20px;background:rgba(15,15,19,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);
    font-size:1.2rem;font-weight:700;color:var(--txt)}
  .logo svg{width:26px;height:30px}
  .top-title{color:var(--muted);font-size:.9rem;border-left:1px solid var(--line);padding-left:14px}
  .top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.85rem;transition:.2s}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#b8912c);color:#1a1408;
    border:none;font-weight:700}
  .btn.gold:hover{filter:brightness(1.1);color:#1a1408}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--muted);padding:8px 16px;cursor:pointer;font-size:.85rem}
  .seg button.on{background:rgba(212,175,55,.15);color:var(--gold)}

  main{flex:1;padding:26px 18px 60px}
  .widok{display:none}
  .widok.on{display:block}

  /* ── drzewo (zagnieżdżone listy z łącznikami) ── */
  #plotno{overflow:auto;padding:30px 10px 50px;min-height:60vh}
  .tree, .tree ul{display:flex;justify-content:center;list-style:none}
  .tree{width:max-content;margin:0 auto}
  .tree ul{padding-top:30px;position:relative}
  .tree ul::before{content:"";position:absolute;top:0;left:50%;height:30px;
    border-left:2px solid var(--line2)}
  .tree li{position:relative;padding:30px 10px 0;display:flex;flex-direction:column;align-items:center}
  .tree li::before,.tree li::after{content:"";position:absolute;top:0;height:30px;width:50%}
  .tree li::before{right:50%;border-top:2px solid var(--line2);border-right:2px solid var(--line2)}
  .tree li::after{left:50%;border-top:2px solid var(--line2)}
  .tree li:only-child::before{border-top:none;height:30px}
  .tree li:only-child::after{display:none}
  .tree li:first-child::before{border-top:none}
  .tree li:last-child::after{border-top:none}
  .tree li:last-child::before{border-radius:0 8px 0 0}
  .tree li:first-child::after{border-radius:8px 0 0 0;border-left:2px solid var(--line2)}
  .tree > li{padding-top:0}
  .tree > li::before,.tree > li::after{display:none}

  /* ── para / karta osoby ── */
  .unit{display:flex;align-items:center;gap:4px}
  .serce{color:var(--gold);opacity:.8;font-size:.9rem;padding:0 2px}
  .osoba{position:relative;width:172px;background:linear-gradient(170deg,#20202b,#17171f);
    border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;text-align:center;
    cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
  .osoba:hover{transform:translateY(-3px);border-color:var(--gold);
    box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .osoba.zaznacz{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.35)}
  .osoba .awatar{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;
    display:grid;place-items:center;font-family:var(--serif);font-size:1.25rem;font-weight:700;
    background:#242433;border:2px solid var(--blekit);color:var(--txt)}
  .osoba.k .awatar{border-color:var(--roz)}
  .osoba .imie{font-weight:600;font-size:.92rem;line-height:1.25}
  .osoba .lata{color:var(--muted);font-size:.76rem;margin-top:2px}
  .osoba .miejsce{color:var(--muted);font-size:.72rem;opacity:.8}
  .osoba .herbik{position:absolute;top:-14px;right:-10px;width:34px;height:44px;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
  .osoba .herbik svg{width:100%;height:100%}
  .osoba .plus{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#1a1408;border:none;border-radius:999px;width:22px;height:22px;
    font-size:.95rem;line-height:1;cursor:pointer;opacity:0;transition:.2s;font-weight:700}
  .osoba:hover .plus{opacity:1}
  .korzen-znak{position:absolute;top:-10px;left:-8px;font-size:1rem}

  .poza{max-width:1000px;margin:30px auto 0;border-top:1px dashed var(--line);padding-top:18px}
  .poza h3{color:var(--muted);font-size:.9rem;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:12px}
  .poza .unit{flex-wrap:wrap;gap:14px}

  /* ── lista ── */
  #widok-lista{max-width:1000px;margin:0 auto}
  .tabela{width:100%;border-collapse:collapse;font-size:.9rem}
  .tabela th{color:var(--gold);text-transform:uppercase;font-size:.72rem;letter-spacing:.1em;
    text-align:left;padding:10px 10px;border-bottom:1px solid var(--gold)}
  .tabela td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--muted)}
  .tabela td:first-child{color:var(--txt);font-weight:600}
  .tabela tr{cursor:pointer;transition:background .15s}
  .tabela tbody tr:hover{background:rgba(212,175,55,.06)}
  .tabela .mini-h{width:22px;height:28px;vertical-align:middle;margin-right:8px}
  .tag-plec{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
  .tag-plec.m{background:var(--blekit)} .tag-plec.k{background:var(--roz)}

  /* ── szuflada edycji ── */
  .szuflada{position:fixed;top:0;right:0;bottom:0;width:min(360px,94vw);z-index:60;
    background:var(--bg2);border-left:1px solid var(--gold);padding:20px 20px 30px;
    transform:translateX(105%);transition:transform .28s ease;overflow-y:auto;
    box-shadow:-18px 0 50px rgba(0,0,0,.5)}
  .szuflada.otwarta{transform:none}
  .sz-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .sz-head h3{font-size:1.3rem;color:var(--gold2)}
  .sz-close{margin-left:auto;background:none;border:none;color:var(--muted);
    font-size:1.4rem;cursor:pointer}
  .sz-close:hover{color:var(--gold)}
  .pole{margin-bottom:12px}
  .pole label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin-bottom:4px}
  .pole input,.pole select,.pole textarea{width:100%;background:var(--bg);color:var(--txt);
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:.9rem;
    font-family:inherit;outline:none}
  .pole input:focus,.pole select:focus,.pole textarea:focus{border-color:var(--gold)}
  .pole-rzad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sz-akcje{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 8px}
  .sz-akcje .btn{text-align:center}
  .btn.danger{border-color:#7c2b33;color:#ff8090}
  .btn.danger:hover{border-color:#ff5c6c;color:#ff5c6c}
  .sz-herb-pod{display:flex;justify-content:center;margin:6px 0 2px;min-height:10px}
  .sz-herb-pod svg{width:74px;height:96px}
  .zaslona{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;opacity:0;
    pointer-events:none;transition:opacity .25s}
  .zaslona.on{opacity:1;pointer-events:auto}

  footer{padding:26px;text-align:center;color:var(--muted);font-size:.85rem}
  .pusty{max-width:520px;margin:40px auto;text-align:center;color:var(--muted);
    border:1px dashed var(--line);border-radius:16px;padding:36px 22px}

  /* ── zoom drzewa ── */
  #skala{width:max-content;margin:0 auto;transform-origin:top left;transition:transform .2s}
  .zoom-ctl{position:fixed;right:14px;bottom:16px;z-index:45;display:flex;
    flex-direction:column;gap:7px}
  .zoom-ctl button{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);
    background:rgba(22,22,29,.95);color:var(--gold);font-size:1.15rem;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.5);transition:.2s}
  .zoom-ctl button:hover{background:var(--gold);color:#1a1408}
  .zoom-ctl[hidden]{display:none}

  /* ── wersja mobilna ── */
  @media(max-width:640px){
    .topbar{gap:8px;padding:10px 12px}
    .logo{font-size:1.05rem}
    .logo svg{width:22px;height:26px}
    .top-title{display:none}
    .seg button{padding:7px 11px;font-size:.78rem}
    .top-actions{gap:6px;margin-left:0;width:100%;overflow-x:auto;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
    .top-actions::-webkit-scrollbar{display:none}
    .btn{padding:7px 11px;font-size:.78rem;white-space:nowrap}
    main{padding:14px 6px 70px}
    #plotno{padding:20px 4px 40px}
    .osoba{width:150px;padding:12px 8px 10px}
    .osoba .awatar{width:44px;height:44px;font-size:1.05rem}
    .osoba .imie{font-size:.85rem}
    .osoba .herbik{width:28px;height:37px;top:-11px;right:-7px}
    .tree li{padding:26px 5px 0}
    #widok-lista{overflow-x:auto}
    .tabela{min-width:640px;font-size:.82rem}
    .zoom-ctl{right:10px;bottom:12px}
    .zoom-ctl button{width:38px;height:38px}
  }
</style>
</head>

</content>
</invoke>

<div class="topbar">
  <a class="logo" href="./">
    <svg viewBox="0 0 30 34" aria-hidden="true">
      <path d="M15 1 28 6v10c0 8-5.5 13.5-13 17C7.5 29.5 2 24 2 16V6z"
            fill="#1a1a23" stroke="#d4af37" stroke-width="1.6"/>
      <path d="M15 6.5 17.2 12h5.6l-4.5 3.6 1.7 5.7-5-3.4-5 3.4 1.7-5.7L7.2 12h5.6z" fill="#d4af37"/>
    </svg>
    Herbarz Polski
  </a>
  <span class="top-title">Drzewo rodziny</span>
  <div class="seg" role="tablist">
    <button id="tab-drzewo" class="on">🌳 Drzewo</button>
    <button id="tab-lista">📋 Lista</button>
  </div>
  <div class="top-actions">
    <button class="btn gold" id="b-dodaj">＋ Dodaj osobę</button>
    <button class="btn" id="b-eksport">⬇ Eksport</button>
    <button class="btn" id="b-import">⬆ Import</button>
    <input type="file" id="plik-import" accept=".json" hidden>
    <button class="btn danger" id="b-wyczysc">Wyczyść</button>
  </div>
</div>

<main>
  <div id="widok-drzewo" class="widok on">
    <div id="plotno"></div>
    <div class="poza" id="poza" hidden>
      <h3>Osoby poza drzewem</h3>
      <div class="unit" id="poza-lista"></div>
    </div>
  </div>
  <div id="widok-lista" class="widok">
    <table class="tabela">
      <thead><tr><th>Osoba</th><th>Lata</th><th>Miejsce</th><th>Herb</th><th>Rodzina</th></tr></thead>
      <tbody id="lista-tbody"></tbody>
    </table>
  </div>
</main>

<div class="zoom-ctl" id="zoom-ctl">
  <button id="z-plus" title="Powiększ">＋</button>
  <button id="z-fit" title="Dopasuj do ekranu">⌂</button>
  <button id="z-minus" title="Pomniejsz">−</button>
</div>

<div class="zaslona" id="zaslona"></div>
<aside class="szuflada" id="szuflada">
  <div class="sz-head"><h3 id="sz-tytul">Edycja osoby</h3>
    <button class="sz-close" id="sz-close" title="Zamknij">✕</button></div>
  <div class="pole-rzad">
    <div class="pole"><label for="e-imie">Imię</label><input id="e-imie"></div>
    <div class="pole"><label for="e-nazwisko">Nazwisko</label><input id="e-nazwisko"></div>
  </div>
  <div class="pole-rzad">
    <div class="pole"><label for="e-plec">Płeć</label>
      <select id="e-plec"><option value="M">Mężczyzna</option><option value="K">Kobieta</option></select></div>
    <div class="pole"><label for="e-rodowe">Nazwisko rodowe</label><input id="e-rodowe" placeholder="z domu…"></div>
  </div>
  <div class="pole-rzad">
    <div class="pole"><label for="e-ur">Rok urodzenia</label><input id="e-ur" placeholder="np. 1932"></div>
    <div class="pole"><label for="e-zm">Rok śmierci</label><input id="e-zm" placeholder="—"></div>
  </div>
  <div class="pole"><label for="e-miejsce">Miejscowość</label><input id="e-miejsce" placeholder="np. Kalisz"></div>
  <div class="pole"><label for="e-herb">Herb rodowy</label>
    <input id="e-herb" list="dl-herby" placeholder="np. Zaremba"><datalist id="dl-herby"></datalist></div>
  <div class="sz-herb-pod" id="sz-herb-pod"></div>
  <div class="pole"><label for="e-partner">Współmałżonek / partner</label><select id="e-partner"></select></div>
  <div class="pole-rzad">
    <div class="pole"><label for="e-ojciec">Ojciec</label><select id="e-ojciec"></select></div>
    <div class="pole"><label for="e-matka">Matka</label><select id="e-matka"></select></div>
  </div>
  <div class="pole"><label for="e-notatki">Notatki</label><textarea id="e-notatki" rows="3" placeholder="historia, zawód, ciekawostki…"></textarea></div>
  <div class="sz-akcje">
    <button class="btn" id="b-dziecko">＋ dziecko</button>
    <button class="btn" id="b-partner">＋ partner/ka</button>
    <button class="btn" id="b-korzen">⚑ początek rodu</button>
    <button class="btn danger" id="b-usun">🗑 usuń osobę</button>
  </div>
  <p style="color:var(--muted);font-size:.75rem">Zmiany zapisują się automatycznie w tej przeglądarce.</p>
</aside>

<footer>⚜ Herbarz Polski · <a href="./">← katalog herbów i sklep</a> · <a href="../../">kolekcja stron</a></footer>

<script src="nazwiska.js"></script>
<script>
/* ═══ Drzewo rodziny — edytowalne widoki (styl MyHeritage) ═══ */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KLUCZ = "herbarz-drzewo";

/* ── stan ── */
let stan = null;
try { stan = JSON.parse(localStorage.getItem(KLUCZ)); } catch(e) {}
if (!stan || !Array.isArray(stan.osoby) || !stan.osoby.length) {
  /* przykładowa rodzina na start */
  stan = { nastepneId: 10, korzen: 1, osoby: [
    {id:1,imie:"Stanisław",nazwisko:"Zaremba",rodowe:"",plec:"M",ur:"1898",zm:"1976",miejsce:"Kalisz",herb:"Zaremba",partner:2,ojciec:null,matka:null,notatki:"Powstaniec wielkopolski, młynarz."},
    {id:2,imie:"Maria",nazwisko:"Zaremba",rodowe:"Dunin",plec:"K",ur:"1904",zm:"1989",miejsce:"Kalisz",herb:"Łabędź",partner:1,ojciec:null,matka:null,notatki:""},
    {id:3,imie:"Jan",nazwisko:"Zaremba",rodowe:"",plec:"M",ur:"1932",zm:"2001",miejsce:"Poznań",herb:"Zaremba",partner:4,ojciec:1,matka:2,notatki:"Inżynier budownictwa."},
    {id:4,imie:"Halina",nazwisko:"Zaremba",rodowe:"Kowalska",plec:"K",ur:"1938",zm:"",miejsce:"Poznań",herb:"Korab",partner:3,ojciec:null,matka:null,notatki:""},
    {id:5,imie:"Barbara",nazwisko:"Lasocka",rodowe:"Zaremba",plec:"K",ur:"1935",zm:"2020",miejsce:"Kalisz",herb:"Zaremba",partner:null,ojciec:1,matka:2,notatki:""},
    {id:6,imie:"Andrzej",nazwisko:"Zaremba",rodowe:"",plec:"M",ur:"1960",zm:"",miejsce:"Poznań",herb:"Zaremba",partner:7,ojciec:3,matka:4,notatki:""},
    {id:7,imie:"Ewa",nazwisko:"Zaremba",rodowe:"Nowicka",plec:"K",ur:"1963",zm:"",miejsce:"Poznań",herb:"Nowina",partner:6,ojciec:null,matka:null,notatki:""},
    {id:8,imie:"Michał",nazwisko:"Zaremba",rodowe:"",plec:"M",ur:"1990",zm:"",miejsce:"Warszawa",herb:"Zaremba",partner:null,ojciec:6,matka:7,notatki:""},
    {id:9,imie:"Anna",nazwisko:"Zaremba",rodowe:"",plec:"K",ur:"1993",zm:"",miejsce:"Gdańsk",herb:"Zaremba",partner:null,ojciec:6,matka:7,notatki:""},
  ]};
}
const zapisz = () => localStorage.setItem(KLUCZ, JSON.stringify(stan));
const os = id => stan.osoby.find(o => o.id === id) || null;
const herbDef = n => n ? HERBY.find(h => h.n.toLowerCase() === String(n).trim().toLowerCase()) : null;

/* ── karta osoby ── */
function inicjaly(o){ return ((o.imie[0]||"") + (o.nazwisko[0]||"")).toUpperCase() || "?"; }
function lata(o){
  if (!o.ur && !o.zm) return "";
  return `${o.ur || "?"} – ${o.zm || (o.ur ? "" : "?")}`.replace(/ – $/, "");
}
function kartaOsoby(o){
  const h = herbDef(o.herb);
  return `<div class="osoba ${o.plec==="K"?"k":"m"} ${o.id===zaznaczonyId?"zaznacz":""}" data-id="${o.id}">
    ${o.id===stan.korzen ? '<span class="korzen-znak" title="Początek rodu">⚑</span>' : ""}
    ${h ? `<span class="herbik" title="herb ${esc(h.n)}">${shieldSVG(h)}</span>` : ""}
    <div class="awatar">${esc(inicjaly(o))}</div>
    <div class="imie">${esc(o.imie)} ${esc(o.nazwisko)}</div>
    ${o.rodowe ? `<div class="lata">z d. ${esc(o.rodowe)}</div>` : ""}
    <div class="lata">${esc(lata(o))}</div>
    ${o.miejsce ? `<div class="miejsce">${esc(o.miejsce)}</div>` : ""}
    <button class="plus" data-plus="${o.id}" title="Dodaj dziecko">＋</button>
  </div>`;
}

/* ── budowa drzewa potomków od korzenia ── */
function dzieciPary(a, b){
  return stan.osoby.filter(o =>
    (a && (o.ojciec === a.id || o.matka === a.id)) ||
    (b && (o.ojciec === b.id || o.matka === b.id)));
}
function wezel(o, widziane){
  if (widziane.has(o.id)) return "";
  widziane.add(o.id);
  const p = o.partner ? os(o.partner) : null;
  if (p) widziane.add(p.id);
  const dzieci = dzieciPary(o, p)
    .sort((x,y) => String(x.ur).localeCompare(String(y.ur)));
  const para = `<div class="unit">${kartaOsoby(o)}${p ? `<span class="serce">∞</span>${kartaOsoby(p)}` : ""}</div>`;
  const galezie = dzieci.map(d => `<li>${wezel(d, widziane)}</li>`).join("");
  return para + (galezie ? `<ul>${galezie}</ul>` : "");
}
function renderDrzewo(){
  const plotno = document.getElementById("plotno");
  const korzen = os(stan.korzen) || stan.osoby[0];
  if (!korzen){
    plotno.innerHTML = `<div class="pusty"><p style="font-size:2rem">🌳</p>
      <p>Drzewo jest puste.</p><p style="margin-top:8px">Kliknij <b style="color:var(--gold)">＋ Dodaj osobę</b>, aby zacząć budować historię rodziny.</p></div>`;
    document.getElementById("poza").hidden = true;
    return;
  }
  const widziane = new Set();
  plotno.innerHTML = `<div id="skala"><ul class="tree"><li>${wezel(korzen, widziane)}</li></ul></div>`;
  ustawZoom(zoom);
  const poza = stan.osoby.filter(o => !widziane.has(o.id));
  document.getElementById("poza").hidden = !poza.length;
  document.getElementById("poza-lista").innerHTML = poza.map(kartaOsoby).join("");
}

/* ── zoom drzewa ── */
let zoom = 1, autoFit = false;
function ustawZoom(z){
  zoom = Math.min(1.6, Math.max(0.3, z));
  const s = document.getElementById("skala");
  if (s) s.style.transform = `scale(${zoom})`;
}
function dopasujZoom(){
  const plotno = document.getElementById("plotno");
  const drzewo = plotno.querySelector(".tree");
  if (!drzewo) return;
  ustawZoom(1);
  const szer = drzewo.getBoundingClientRect().width;
  const fit = (plotno.clientWidth - 16) / szer;
  ustawZoom(Math.min(1, fit));
}
document.getElementById("z-plus").addEventListener("click", () => ustawZoom(zoom + 0.15));
document.getElementById("z-minus").addEventListener("click", () => ustawZoom(zoom - 0.15));
document.getElementById("z-fit").addEventListener("click", dopasujZoom);

/* ── widok listy ── */
function renderLista(){
  const tb = document.getElementById("lista-tbody");
  const posort = [...stan.osoby].sort((a,b) =>
    (a.nazwisko+a.imie).localeCompare(b.nazwisko+b.imie, "pl"));
  tb.innerHTML = posort.map(o => {
    const h = herbDef(o.herb);
    const p = o.partner ? os(o.partner) : null;
    const rodzice = [os(o.ojciec), os(o.matka)].filter(Boolean).map(r => esc(r.imie)).join(", ");
    return `<tr data-id="${o.id}">
      <td><span class="tag-plec ${o.plec==="K"?"k":"m"}"></span>${esc(o.imie)} ${esc(o.nazwisko)}${o.rodowe?` <span style="color:var(--muted);font-weight:400">(z d. ${esc(o.rodowe)})</span>`:""}</td>
      <td>${esc(lata(o)) || "—"}</td>
      <td>${esc(o.miejsce) || "—"}</td>
      <td>${h ? `<span class="mini-h" style="display:inline-block">${shieldSVG(h)}</span>${esc(h.n)}` : "—"}</td>
      <td>${p ? "∞ " + esc(p.imie) : ""}${rodzice ? `<span style="opacity:.7"> · rodzice: ${rodzice}</span>` : ""}</td>
    </tr>`;
  }).join("");
}

function renderuj(){ renderDrzewo(); renderLista(); zapisz(); }

/* ── szuflada edycji ── */
let zaznaczonyId = null;
const szuflada = document.getElementById("szuflada");
const zaslona = document.getElementById("zaslona");
const POLA = ["imie","nazwisko","rodowe","plec","ur","zm","miejsce","herb","notatki"];
document.getElementById("dl-herby").innerHTML = HERBY.map(h => `<option value="${h.n}">`).join("");

function opcjeOsob(sel, poza){
  return `<option value="">—</option>` + stan.osoby
    .filter(o => o.id !== poza)
    .map(o => `<option value="${o.id}" ${o.id===sel?"selected":""}>${esc(o.imie)} ${esc(o.nazwisko)} ${o.ur?`(${esc(o.ur)})`:""}</option>`).join("");
}
function otworz(id){
  const o = os(id); if (!o) return;
  zaznaczonyId = id;
  document.getElementById("sz-tytul").textContent = `${o.imie} ${o.nazwisko}`;
  for (const p of POLA) document.getElementById("e-"+p).value = o[p] ?? "";
  document.getElementById("e-partner").innerHTML = opcjeOsob(o.partner, id);
  document.getElementById("e-ojciec").innerHTML = opcjeOsob(o.ojciec, id);
  document.getElementById("e-matka").innerHTML = opcjeOsob(o.matka, id);
  podgladHerbu(o.herb);
  szuflada.classList.add("otwarta");
  zaslona.classList.add("on");
  renderuj();
}
function zamknij(){
  zaznaczonyId = null;
  szuflada.classList.remove("otwarta");
  zaslona.classList.remove("on");
  renderuj();
}
function podgladHerbu(nazwa){
  const h = herbDef(nazwa);
  document.getElementById("sz-herb-pod").innerHTML = h ? shieldSVG(h) : "";
}
POLA.forEach(p => document.getElementById("e-"+p).addEventListener("input", () => {
  const o = os(zaznaczonyId); if (!o) return;
  o[p] = document.getElementById("e-"+p).value;
  if (p === "herb") podgladHerbu(o.herb);
  document.getElementById("sz-tytul").textContent = `${o.imie} ${o.nazwisko}`;
  renderuj();
}));
[["e-partner","partner"],["e-ojciec","ojciec"],["e-matka","matka"]].forEach(([el,pole]) => {
  document.getElementById(el).addEventListener("change", () => {
    const o = os(zaznaczonyId); if (!o) return;
    const v = document.getElementById(el).value;
    const nowy = v ? +v : null;
    if (pole === "partner"){
      if (o.partner){ const stary = os(o.partner); if (stary && stary.partner === o.id) stary.partner = null; }
      o.partner = nowy;
      if (nowy){ const par = os(nowy); if (par) par.partner = o.id; }
    } else o[pole] = nowy;
    renderuj();
    otworz(o.id);
  });
});

/* ── operacje ── */
function nowaOsoba(dane){
  const o = Object.assign({id:stan.nastepneId++, imie:"Nowa", nazwisko:"Osoba", rodowe:"",
    plec:"M", ur:"", zm:"", miejsce:"", herb:"", notatki:"", partner:null, ojciec:null, matka:null}, dane);
  stan.osoby.push(o);
  return o;
}
document.getElementById("b-dodaj").addEventListener("click", () => {
  const o = nowaOsoba({imie:"Nowa", nazwisko:"Osoba"});
  if (!os(stan.korzen)) stan.korzen = o.id;
  renderuj(); otworz(o.id);
});
document.getElementById("b-dziecko").addEventListener("click", () => {
  const o = os(zaznaczonyId); if (!o) return;
  const d = nowaOsoba({imie:"Dziecko", nazwisko:o.nazwisko,
    [o.plec==="K"?"matka":"ojciec"]:o.id,
    [o.plec==="K"?"ojciec":"matka"]:o.partner || null});
  renderuj(); otworz(d.id);
});
document.getElementById("b-partner").addEventListener("click", () => {
  const o = os(zaznaczonyId); if (!o) return;
  const p = nowaOsoba({imie:o.plec==="K"?"Partner":"Partnerka", nazwisko:o.nazwisko,
    plec:o.plec==="K"?"M":"K", partner:o.id});
  o.partner = p.id;
  renderuj(); otworz(p.id);
});
document.getElementById("b-korzen").addEventListener("click", () => {
  if (zaznaczonyId){ stan.korzen = zaznaczonyId; renderuj(); }
});
document.getElementById("b-usun").addEventListener("click", () => {
  const o = os(zaznaczonyId); if (!o) return;
  if (!confirm(`Usunąć osobę ${o.imie} ${o.nazwisko} z drzewa?`)) return;
  stan.osoby = stan.osoby.filter(x => x.id !== o.id);
  stan.osoby.forEach(x => {
    if (x.partner === o.id) x.partner = null;
    if (x.ojciec === o.id) x.ojciec = null;
    if (x.matka === o.id) x.matka = null;
  });
  if (stan.korzen === o.id) stan.korzen = stan.osoby[0]?.id ?? null;
  zamknij();
});
document.getElementById("sz-close").addEventListener("click", zamknij);
zaslona.addEventListener("click", zamknij);

/* klik w kartę / wiersz / plus */
document.addEventListener("click", e => {
  const plus = e.target.closest("[data-plus]");
  if (plus){
    e.stopPropagation();
    otworz(+plus.dataset.plus);
    document.getElementById("b-dziecko").click();
    return;
  }
  const karta = e.target.closest(".osoba[data-id]");
  if (karta){ otworz(+karta.dataset.id); return; }
  const wiersz = e.target.closest("tr[data-id]");
  if (wiersz) otworz(+wiersz.dataset.id);
});

/* ── przełącznik widoków ── */
const tabD = document.getElementById("tab-drzewo"), tabL = document.getElementById("tab-lista");
function widok(nazwa){
  document.getElementById("widok-drzewo").classList.toggle("on", nazwa==="drzewo");
  document.getElementById("widok-lista").classList.toggle("on", nazwa==="lista");
  tabD.classList.toggle("on", nazwa==="drzewo");
  tabL.classList.toggle("on", nazwa==="lista");
  document.getElementById("zoom-ctl").hidden = nazwa !== "drzewo";
}
tabD.addEventListener("click", () => widok("drzewo"));
tabL.addEventListener("click", () => widok("lista"));

/* ── eksport / import / czyszczenie ── */
document.getElementById("b-eksport").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(stan, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "drzewo-rodziny.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("b-import").addEventListener("click", () =>
  document.getElementById("plik-import").click());
document.getElementById("plik-import").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      const nowy = JSON.parse(t);
      if (!Array.isArray(nowy.osoby)) throw 0;
      stan = nowy; renderuj();
    } catch { alert("Nieprawidłowy plik drzewa."); }
  });
});
document.getElementById("b-wyczysc").addEventListener("click", () => {
  if (!confirm("Usunąć całe drzewo? Tej operacji nie można cofnąć.")) return;
  stan = {nastepneId:1, korzen:null, osoby:[]};
  zamknij();
});

renderuj();
if (window.innerWidth < 900) requestAnimationFrame(dopasujZoom);
</script>
</body>
</html>
